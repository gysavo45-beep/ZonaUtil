<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Contacto | Zona Útil</title>

  <meta name="description"
        content="Contacta con el equipo de Zona Útil.">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #172033;
      line-height: 1.6;
    }

    header {
      background: linear-gradient(135deg, #2563eb, #7c3aed);
      color: white;
      padding: 40px 20px;
      text-align: center;
    }

    header h1 {
      font-size: 35px;
      margin-bottom: 8px;
    }

    .container {
      width: min(850px, 92%);
      margin: 35px auto;
    }

    .contact-box {
      background: white;
      padding: 35px;
      border-radius: 20px;
      box-shadow: 0 10px 35px rgba(0,0,0,.07);
    }

    h2 {
      color: #2563eb;
      margin-bottom: 10px;
    }

    .intro {
      color: #64748b;
      margin-bottom: 25px;
    }

    label {
      display: block;
      font-weight: bold;
      margin: 15px 0 7px;
    }

    input,
    textarea {
      width: 100%;
      padding: 14px;

      border: 1px solid #dbe1ea;
      border-radius: 10px;

      font-size: 16px;
      outline: none;
    }

    input:focus,
    textarea:focus {
      border-color: #2563eb;
    }

    textarea {
      min-height: 160px;
      resize: vertical;
    }

    button {
      margin-top: 20px;

      border: 0;

      padding: 14px 22px;

      border-radius: 10px;

      background: linear-gradient(
        135deg,
        #2563eb,
        #4f46e5
      );

      color: white;

      font-weight: bold;
      font-size: 16px;

      cursor: pointer;
    }

    button:hover {
      opacity: .9;
    }

    .email-box {
      margin-top: 30px;
      padding: 20px;

      background: #eff6ff;

      border-radius: 12px;
    }

    .email-box a {
      color: #2563eb;
      font-weight: bold;
    }

    .back {
      display: inline-block;
      margin-top: 25px;
      padding: 12px 18px;
      background: #111827;
      color: white;
      border-radius: 10px;
      text-decoration: none;
    }

    footer {
      margin-top: 40px;
      padding: 25px;
      text-align: center;
      background: #0f172a;
      color: #94a3b8;
    }

    @media(max-width:600px) {
      .contact-box {
        padding: 22px;
      }

      header h1 {
        font-size: 28px;
      }
    }
  </style>
</head>

<body>

<header>

  <h1>📩 Contacto</h1>

  <p>
    Estamos para ayudarte
  </p>

</header>


<main class="container">

  <section class="contact-box">

    <h2>
      Ponte en contacto
    </h2>

    <p class="intro">

      ¿Tienes una pregunta, sugerencia o encontraste
      algún problema en Zona Útil? Escríbenos.

    </p>


    <form
      onsubmit="enviarMensaje(event)">

      <label for="nombre">
        Nombre
      </label>

      <input
        type="text"
        id="nombre"
        placeholder="Tu nombre"
        required>


      <label for="email">
        Correo electrónico
      </label>

      <input
        type="email"
        id="email"
        placeholder="tu@email.com"
        required>


      <label for="mensaje">
        Mensaje
      </label>

      <textarea
        id="mensaje"
        placeholder="Escribe tu mensaje..."
        required></textarea>


      <button type="submit">
        ✉️ Enviar mensaje
      </button>

    </form>


    <div class="email-box">

      <h2>
        📧 Correo
      </h2>

      <p>
        También puedes escribirnos directamente:
      </p>

      <a
        href="mailto:contacto@tudominio.com">

        contacto@tudominio.com

      </a>

    </div>


    <a
      class="back"
      href="index.html">

      ← Volver a Zona Útil

    </a>

  </section>

</main>


<footer>

  © 2026 Zona Útil.
  Todos los derechos reservados.

</footer>


<script>

function enviarMensaje(event) {

  event.preventDefault();

  const nombre =
    document.getElementById("nombre").value;

  const email =
    document.getElementById("email").value;

  const mensaje =
    document.getElementById("mensaje").value;


  const asunto =
    "Contacto desde Zona Útil";


  const cuerpo =
    "Nombre: " +
    nombre +
    "\n\nCorreo: " +
    email +
    "\n\nMensaje:\n" +
    mensaje;


  window.location.href =
    "mailto:contacto@tudominio.com" +
    "?subject=" +
    encodeURIComponent(asunto) +
    "&body=" +
    encodeURIComponent(cuerpo);

}

</script>

</body>
</html>
