<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Cara o cruz online. Lanzamiento de moneda virtual.">
<title>Cara o cruz | Zona Útil</title>
<style>
body{margin:0;font-family:Arial;background:#f4f7fb;color:#172033}.box{max-width:650px;margin:50px auto;padding:25px;text-align:center}.card{background:white;padding:35px;border-radius:20px;box-shadow:0 10px 35px #0001}.coin{font-size:110px;margin:30px}button{padding:15px 25px;border:0;border-radius:10px;background:#2563eb;color:white;font-weight:bold;cursor:pointer}.back{color:#2563eb}
</style>
</head>
<body>
<div class="box">
<a class="back" href="../index.html">← Volver</a>
<div class="card">
<h1>🪙 Cara o cruz</h1>
<div class="coin" id="moneda">🪙</div>
<h2 id="resultado">Pulsa lanzar</h2>
<button onclick="lanzar()">LANZAR MONEDA</button>
</div>
</div>
<script>
function lanzar(){
 const r=Math.random()<.5?'CARA':'CRUZ';
 moneda.textContent=r==='CARA'?'🙂':'🌙';
 resultado.textContent=r;
}
</script>
</body>
